<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign In - Event Ticketing Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            font-family: Inter, sans-serif;
            background-color: #f4f6f8;
            color: #0f172a;
        }
        .login-card {
            max-width: 430px;
            border: 1px solid #e2e8f0;
            border-radius: 1rem;
            box-shadow: 0 10px 25px -5px rgba(15, 23, 42, .08) !important;
        }
        .btn-primary { background: #2563eb; border-color: #2563eb; }
        .btn-primary:hover { background: #1d4ed8; border-color: #1d4ed8; }
        .form-control, .form-select { border-color: #cbd5e1; }
        .form-control:focus, .form-select:focus { border-color: #2563eb; box-shadow: 0 0 0 .2rem rgba(37, 99, 235, .15); }
    </style>
</head>
<body class="py-5">
    <main class="container" style="max-width: 960px;">
        <div class="text-center mb-4">
            <span class="badge bg-primary-subtle text-primary fw-semibold px-3 py-2 rounded-pill mb-2">
                Ticketing
            </span>
            <h1 class="h2 fw-bold text-dark mb-1">Event Booking Portal</h1>
            <p class="text-secondary small mb-0">Sign in to manage your event tickets.</p>
        </div>

        <div class="card login-card shadow-sm bg-white mx-auto">
            <div class="card-body p-4 p-md-5">
                <div class="mb-4">
                    <h5 class="fw-bold text-dark mb-1">Sign in</h5>
                    <p class="text-secondary small mb-0">Enter your account credentials to continue.</p>
                </div>

                <div id="alertBox" class="alert d-none mb-4" role="alert" aria-live="polite"></div>

                <form id="loginForm" novalidate>
                    <div class="mb-3">
                        <label for="email" class="form-label text-secondary small fw-medium">Email</label>
                        <input id="email" name="email" type="email" class="form-control form-control-lg fs-6" autocomplete="email" required>
                        <div class="invalid-feedback">Enter your email.</div>
                    </div>
                    <div class="mb-4">
                        <label for="password" class="form-label text-secondary small fw-medium">Password</label>
                        <input id="password" name="password" type="password" class="form-control form-control-lg fs-6" autocomplete="current-password" required>
                        <div class="invalid-feedback">Enter your password.</div>
                    </div>
                    <button id="loginButton" type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                        Sign in
                    </button>
                </form>
            </div>
        </div>
    </main>

    <script>
        const LOGIN_API = 'http://localhost/events_booking/backend/login.php';
        const form = document.getElementById('loginForm');
        const button = document.getElementById('loginButton');
        const alertBox = document.getElementById('alertBox');

        function showAlert(type, message) {
            alertBox.className = `alert alert-${type} mb-4`;
            alertBox.textContent = message;
        }

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            form.classList.add('was-validated');
            if (!form.checkValidity()) return;

            button.disabled = true;
            button.innerHTML = '<span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>Signing in...';

            try {
                const response = await fetch(LOGIN_API, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: document.getElementById('email').value.trim(),
                        password: document.getElementById('password').value
                    })
                });
                const result = await response.json();

                if (!response.ok || result.success !== true) {
                    throw new Error(result.message || 'Unable to sign in.');
                }

                sessionStorage.setItem('event_booking_token', result.token);
                sessionStorage.setItem('event_booking_user', JSON.stringify(result.user));
                const role = String(result.user.role || '').trim().toLowerCase();
                if (role === 'customer') {
                    window.location.href = 'booking.html';
                } else if (role === 'administrator') {
                    window.location.href = 'admin-dashboard.html';
                } else {
                    window.location.href = 'dashboard.html';
                }
            } catch (error) {
                showAlert('danger', error.message);
            } finally {
                button.disabled = false;
                button.textContent = 'Sign in';
            }
        });
    </script>
</body>
</html>
